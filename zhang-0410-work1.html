<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>今天也要好好生活 · 温暖小屋</title>
<meta name="description" content="一个简单、精美、温馨的小页面：跟随时间问候你，并送上一句暖心的话。" />
<meta name="theme-color" content="#fff7f0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --cream:#fff7f0;
    --blush:#ffe9dd;
    --rose:#f7cfc0;
    --rose-deep:#eb9f85;
    --ink:#5a463c;
    --ink-soft:#93786a;
    --card:rgba(255,255,255,.72);
    --card-line:rgba(235,159,133,.24);
    --shadow:0 26px 60px -28px rgba(150,92,70,.42), 0 4px 16px rgba(150,92,70,.10);
    --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    --script:"Segoe Script","Brush Script MT","Kaiti SC",KaiTi,STKaiti,"Songti SC",serif;
  }

  *{box-sizing:border-box}
  html,body{height:100%}

  body{
    margin:0;
    font-family:var(--font);
    color:var(--ink);
    background:
      radial-gradient(1100px 700px at 12% -10%, #fffdfa 0%, transparent 60%),
      radial-gradient(900px 620px at 108% 8%, var(--blush) 0%, transparent 58%),
      linear-gradient(160deg, var(--cream) 0%, #fff2ea 52%, #ffe6da 100%);
    background-attachment:fixed;
    display:grid;
    place-items:center;
    min-height:100svh;
    padding:clamp(18px,4vw,52px) 18px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- 背景装饰：柔光 + 缓慢漂浮的圆 ---------- */
  .backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .glow{
    position:absolute;left:50%;top:42%;width:min(78vw,720px);aspect-ratio:1;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,214,193,.55) 0%,rgba(255,214,193,0) 68%);
    filter:blur(6px);
    animation:breathe 11s ease-in-out infinite;
  }
  .orb{
    position:absolute;border-radius:50%;
    background:linear-gradient(150deg,rgba(255,255,255,.9),rgba(247,207,192,.55));
    box-shadow:0 14px 34px -14px rgba(190,120,95,.4);
    filter:blur(.4px);
    animation:drift linear infinite;
  }
  .orb.a{width:74px;height:74px;left:9%;top:20%;animation-duration:22s}
  .orb.b{width:44px;height:44px;left:82%;top:26%;animation-duration:27s;animation-delay:-6s}
  .orb.c{width:104px;height:104px;left:76%;top:70%;opacity:.6;animation-duration:32s;animation-delay:-12s}
  .orb.d{width:32px;height:32px;left:16%;top:76%;opacity:.7;animation-duration:19s;animation-delay:-3s}
  .orb.e{width:58px;height:58px;left:46%;top:9%;opacity:.5;animation-duration:25s;animation-delay:-9s}

  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}50%{transform:translate(-50%,-50%) scale(1.08);opacity:1}}
  @keyframes drift{
    0%{transform:translate3d(0,0,0) rotate(0deg)}
    50%{transform:translate3d(14px,-26px,0) rotate(18deg)}
    100%{transform:translate3d(0,0,0) rotate(0deg)}
  }

  /* ---------- 主卡片 ---------- */
  .card{
    position:relative;z-index:1;
    width:min(660px,100%);
    padding:clamp(30px,5.4vw,58px) clamp(24px,5vw,56px) clamp(28px,4.6vw,46px);
    background:var(--card);
    border:1px solid rgba(255,255,255,.85);
    border-radius:34px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(16px) saturate(1.15);
    -webkit-backdrop-filter:blur(16px) saturate(1.15);
    text-align:center;
    overflow:hidden;
    opacity:0;transform:translateY(22px);
    animation:rise .95s cubic-bezier(.22,.9,.24,1) .1s forwards;
  }
  .card::before{ /* 顶部一抹暖光 */
    content:"";position:absolute;inset:-40% -20% auto;height:62%;
    background:radial-gradient(60% 100% at 50% 100%,rgba(255,203,175,.42),transparent 70%);
    pointer-events:none;
  }
  .card::after{ /* 细边内描线 */
    content:"";position:absolute;inset:10px;border-radius:26px;
    border:1px dashed rgba(235,159,133,.32);pointer-events:none;
  }
  @keyframes rise{to{opacity:1;transform:translateY(0)}}

  .card > *{position:relative;z-index:1}

  /* ---------- 呼吸的小灯 ---------- */
  .lamp{
    font-size:clamp(46px,9vw,62px);line-height:1;
    display:inline-block;
    filter:drop-shadow(0 10px 18px rgba(210,140,110,.35));
    animation:sway 4.6s ease-in-out infinite;
    transform-origin:50% 90%;
  }
  @keyframes sway{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-5px)}}

  .hello{
    margin:22px 0 0;
    font-family:var(--script);
    font-size:clamp(30px,6.4vw,50px);
    line-height:1.22;
    letter-spacing:.02em;
    color:#4d3a31;
  }
  .hello .hl{
    background:linear-gradient(180deg,transparent 62%,rgba(255,203,175,.85) 62%);
    border-radius:3px;padding:0 .12em;
  }

  .sub{
    margin:14px auto 0;max-width:44ch;
    font-size:clamp(14.5px,2.5vw,16.5px);
    line-height:1.9;
    color:var(--ink-soft);
  }

  .clock{
    display:inline-flex;align-items:center;gap:10px;
    margin-top:24px;padding:9px 20px;
    border-radius:999px;
    background:rgba(255,255,255,.8);
    border:1px solid var(--card-line);
    box-shadow:0 8px 22px -14px rgba(160,100,80,.55);
    font-size:clamp(13px,2.3vw,14.5px);
    color:#7d6455;
    font-variant-numeric:tabular-nums;
    letter-spacing:.04em;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--rose-deep);animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(235,159,133,.5)}50%{opacity:.45;box-shadow:0 0 0 6px rgba(235,159,133,0)}}

  .divider{
    margin:clamp(24px,4.4vw,34px) auto;width:min(280px,72%);height:1px;
    background:linear-gradient(90deg,transparent,rgba(235,159,133,.55),transparent);
    position:relative;
  }
  .divider span{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:var(--card);padding:0 10px;font-size:13px;color:var(--rose-deep);
    backdrop-filter:blur(6px);
  }

  /* ---------- 暖心卡片 ---------- */
  .quote-box{
    min-height:118px;
    display:grid;place-items:center;
    padding:6px 4px;
  }
  .quote{
    margin:0;
    font-size:clamp(16.5px,3.1vw,20px);
    line-height:2;
    color:#5f4a40;
    letter-spacing:.02em;
    transition:opacity .38s ease,transform .38s ease;
  }
  .quote .mark{color:var(--rose-deep);font-family:var(--script);font-size:1.35em;line-height:0;vertical-align:-.12em}
  .from{
    display:block;margin-top:14px;
    font-size:13px;color:var(--ink-soft);letter-spacing:.14em;
  }
  .fade{opacity:0;transform:translateY(8px)}

  /* ---------- 按钮 ---------- */
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:6px}
  button{
    font-family:inherit;font-size:15px;
    padding:13px 26px;border-radius:999px;
    border:1px solid rgba(235,159,133,.5);
    background:rgba(255,255,255,.9);
    color:#8a6152;cursor:pointer;
    letter-spacing:.06em;
    transition:transform .18s ease,box-shadow .25s ease,background .25s ease,color .25s ease,border-color .25s ease;
    box-shadow:0 10px 24px -18px rgba(150,92,70,.9);
    -webkit-tap-highlight-color:transparent;
  }
  button:hover{transform:translateY(-3px);box-shadow:0 18px 30px -18px rgba(150,92,70,.75);color:#7a5245;border-color:rgba(235,159,133,.85)}
  button:active{transform:translateY(-1px) scale(.985)}
  button:focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px}
  button.primary{
    background:linear-gradient(135deg,#ffd9c7,#f8b79c);
    border-color:transparent;color:#6a4335;font-weight:600;
    box-shadow:0 16px 30px -18px rgba(214,120,90,.95);
  }
  button.primary:hover{background:linear-gradient(135deg,#ffcdb6,#f2a888)}

  footer{
    margin-top:clamp(24px,4vw,32px);
    font-size:12.5px;color:#a58b7d;letter-spacing:.1em;line-height:2;
  }
  .warm-heart{color:var(--rose-deep)}

  /* ---------- 点击飘心 ---------- */
  .pop{
    position:fixed;z-index:99;pointer-events:none;user-select:none;
    font-size:20px;line-height:1;
    animation:pop 1.5s cubic-bezier(.2,.7,.2,1) forwards;
    will-change:transform,opacity;
  }
  @keyframes pop{
    0%{transform:translate(-50%,-50%) scale(.4) rotate(0deg);opacity:0}
    22%{opacity:1}
    100%{transform:translate(-50%,-220%) scale(1.45) rotate(var(--rot,18deg));opacity:0}
  }

  @media (max-width:420px){
    .card{border-radius:26px}
    .card::after{inset:7px;border-radius:20px}
    button{padding:12px 20px;font-size:14px}
    .quote-box{min-height:132px}
  }

  /* 尊重「减弱动态效果」偏好 */
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .card{opacity:1;transform:none}
  }

  /* 浅色打印 */
  @media print{
    body{background:#fff}
    .backdrop,.card::after{display:none}
    .card{box-shadow:none;border:1px solid #eee}
  }
</style>
</head>
<body>

  <div class="backdrop" aria-hidden="true">
    <div class="glow"></div>
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
    <div class="orb d"></div>
    <div class="orb e"></div>
  </div>

  <main class="card">
    <div class="lamp" role="img" aria-label="一盏暖灯">🏡</div>

    <h1 class="hello" id="greeting">你好呀，<span class="hl">欢迎回家</span> 🌿</h1>

    <p class="sub" id="subline">慢一点也没关系，这里有一盏灯一直为你亮着。</p>

    <div class="clock">
      <span class="dot" aria-hidden="true"></span>
      <span id="today">—</span>
      <span aria-hidden="true">·</span>
      <span id="now">--:--:--</span>
    </div>

    <div class="divider"><span>今日份的温柔</span></div>

    <div class="quote-box" aria-live="polite">
      <blockquote class="quote" id="quoteText">
        <span class="mark">“</span><span id="quoteBody">生活明朗，万物可爱。</span><span class="mark">”</span>
        <span class="from" id="quoteFrom">—— 给你的小纸条</span>
      </blockquote>
    </div>

    <div class="actions">
      <button class="primary" id="btnQuote" type="button">再来一句 ✨</button>
      <button id="btnHello" type="button">把温暖送给屏幕 💛</button>
    </div>

    <footer>
      愿你被这世界温柔以待 <span class="warm-heart">♥</span> <span id="year"></span>
      <br />Made with 一杯热茶与一点点耐心
    </footer>
  </main>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 1. 跟随时间的问候 ---------- */
  var HOUR_GREETING = [
    { from: 5,  to: 9,  title: '早安呀，',   hl: '新的一天开始啦', emoji: '🌅', sub: '先喝一杯温水，再慢慢开始也不迟。' },
    { from: 9,  to: 12, title: '上午好，',   hl: '今天也辛苦了',   emoji: '☀️', sub: '忙里也要记得抬头看看窗外，眼睛也需要休息。' },
    { from: 12, to: 14, title: '午安，',     hl: '记得好好吃饭',   emoji: '🍚', sub: '吃饱了才有力气继续可爱下去呀。' },
    { from: 14, to: 18, title: '下午好，',   hl: '再坚持一下下',   emoji: '🍵', sub: '泡杯茶，深呼吸，剩下的交给时间。' },
    { from: 18, to: 22, title: '晚上好，',   hl: '欢迎回家',       emoji: '🏡', sub: '把今天的疲惫放在门口，进来休息吧。' },
    { from: 22, to: 24, title: '夜深了，',   hl: '该休息啦',       emoji: '🌙', sub: '手机放远一点，让梦先来找你。' },
    { from: 0,  to: 5,  title: '还没睡呀，', hl: '早点休息吧',     emoji: '🌛', sub: '无论多晚，这里都有一盏灯为你亮着。' }
  ];

  /* ---------- 2. 暖心话语 ---------- */
  var QUOTES = [
    '生活明朗，万物可爱。',
    '你今天的努力，会成为明天的小惊喜。',
    '慢慢来，比较快；走得稳，才走得远。',
    '不必追赶月亮，你本身就是星星。',
    '所有糟糕的日子，都在为惊喜做铺垫。',
    '把日子过成诗，先把今天过好。',
    '你已经很棒了，真的，不用怀疑。',
    '愿你熬过的每一个夜，都换来清晨的光。',
    '喜欢的东西要努力去拥有，包括更好的自己。',
    '风会记得一朵花的香，也会记得你的好。',
    '别急，花开花落自有时，你也有你的花期。',
    '今天也要做一件让自己开心的小事。',
    '世界很大，而你值得所有的温柔。',
    '把心放宽一点，日子就软一点。',
    '不去想太远的事，先把这一杯热茶喝完。'
  ];

  /* ---------- 3. 时间与日期 ---------- */
  var WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function greetingFor(h) {
    for (var i = 0; i < HOUR_GREETING.length; i++) {
      var g = HOUR_GREETING[i];
      if (h >= g.from && h < g.to) return g;
    }
    return HOUR_GREETING[5];
  }

  var lastSlot = -1;

  function tick() {
    var d = new Date();
    var h = d.getHours();

    var slot = 0;
    for (var i = 0; i < HOUR_GREETING.length; i++) {
      if (h >= HOUR_GREETING[i].from && h < HOUR_GREETING[i].to) { slot = i; break; }
    }
    if (slot !== lastSlot) {
      lastSlot = slot;
      var g = HOUR_GREETING[slot];
      $('greeting').innerHTML = g.title + '<span class="hl">' + g.hl + '</span> ' + g.emoji;
      $('subline').textContent = g.sub;
    }

    $('today').textContent =
      d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · ' + WEEK[d.getDay()];
    $('now').textContent =
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  tick();
  setInterval(tick, 1000);

  /* ---------- 4. 换一句暖心话 ---------- */
  var quoteEl = $('quoteText');
  var bodyEl = $('quoteBody');
  var fromEl = $('quoteFrom');
  var lastQuote = -1;
  var busy = false;

  function shuffleFrom() {
    var n = 1 + Math.floor(Math.random() * 9);
    var signs = ['给你的小纸条', '来自远方的一封信', '热茶旁边的一句话', '窗台上的便签',
                 '今天的幸运签', '睡前的碎碎念', '写在手心里的话', '路过的小温柔', '刚刚想到你'];
    return '—— ' + signs[n - 1] + ' · ' + n;
  }

  function pickQuote(initial) {
    if (busy) return;
    busy = true;

    var i = lastQuote;
    while (QUOTES.length > 1 && i === lastQuote) {
      i = Math.floor(Math.random() * QUOTES.length);
    }
    lastQuote = i;

    if (initial) {
      bodyEl.textContent = QUOTES[i];
      fromEl.textContent = shuffleFrom();
      busy = false;
      return;
    }

    quoteEl.classList.add('fade');
    setTimeout(function () {
      bodyEl.textContent = QUOTES[i];
      fromEl.textContent = shuffleFrom();
      quoteEl.classList.remove('fade');
      busy = false;
    }, 380);
  }

  pickQuote(true);
  $('btnQuote').addEventListener('click', function (e) {
    pickQuote(false);
    burst(e.clientX, e.clientY, 4);
  });

  /* ---------- 5. 点击飘出小爱心 ---------- */
  var EMOJIS = ['💛', '🌸', '✨', '🍃', '💫', '🌼', '💗'];

  function burst(x, y, count) {
    count = count || 1;
    for (var i = 0; i < count; i++) {
      (function (i) {
        setTimeout(function () {
          var el = document.createElement('span');
          el.className = 'pop';
          el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
          el.style.left = (x + (Math.random() * 70 - 35)) + 'px';
          el.style.top = (y + (Math.random() * 24 - 12)) + 'px';
          el.style.setProperty('--rot', (Math.random() * 70 - 35) + 'deg');
          el.style.fontSize = (15 + Math.random() * 12) + 'px';
          document.body.appendChild(el);
          setTimeout(function () { el.remove(); }, 1600);
        }, i * 70);
      })(i);
    }
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest('button')) return;
    burst(e.clientX, e.clientY, 3);
  });

  /* ---------- 6. 「把温暖送出去」：一点点音效 + 满屏小爱心 ---------- */
  var audioCtx = null;
  function chime() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = audioCtx || new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      [523.25, 659.25, 783.99].forEach(function (f, i) {
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        var t = audioCtx.currentTime + i * 0.13;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.07, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
        o.connect(g).connect(audioCtx.destination);
        o.start(t);
        o.stop(t + 0.85);
      });
    } catch (err) { /* 音效失败也无所谓 */ }
  }

  $('btnHello').addEventListener('click', function (e) {
    chime();
    var x = e.clientX, y = e.clientY;
    burst(x, y, 16);
    var w = window.innerWidth;
    setTimeout(function () {
      for (var i = 1; i <= 6; i++) {
        burst((w / 8) * i, window.innerHeight * (0.35 + Math.random() * 0.4), 2);
      }
    }, 260);
  });

  /* ---------- 7. 页脚年份 ---------- */
  $('year').textContent = new Date().getFullYear();

  /* ---------- 8. 键盘快捷键：空格换一句 ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !e.repeat) {
      e.preventDefault();
      var r = $('btnQuote').getBoundingClientRect();
      pickQuote(false);
      burst(r.left + r.width / 2, r.top + r.height / 2, 3);
    }
  });
})();
</script>
</body>
</html>
